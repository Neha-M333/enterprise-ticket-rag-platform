name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # EVAL_MOCK=1 makes the pytest fixture in eval_harness.py use local
      # mock LLM responses instead of live Gemini calls. CI shouldn't
      # depend on a paid/quota-limited external API to pass or fail —
      # this job verifies the harness's own logic (fixture loading, the
      # 90-day math, scoring, schema validation) deterministically.
      #
      # If GEMINI_API_KEY is configured as a repo secret, this job also
      # runs a second, live pass so real model output gets graded too.
      # A missing secret does not fail the build.
      - name: Run pytest suite (mock mode)
        env:
          EVAL_MOCK: "1"
        run: |
          pytest src/eval_harness.py -v

      - name: Run pytest suite (live Gemini, optional)
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest src/eval_harness.py -v